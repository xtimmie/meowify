name: release
on:
  push:
    branches: [main]
    paths:
      - meowify.py
      - requirements.txt
      - launcher.pyw
      - android_patch.py
      - motionui.version
      - install.ps1
      - install.sh
      - CHANGELOG.md
      - .github/workflows/release.yaml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: read version
        id: ver
        run: |
          VER=$(python3 - <<'EOF'
          import re
          m = re.search(r"^APP_VERSION = '([^']+)'", open('meowify.py', encoding='utf-8').read(), re.M)
          print(m.group(1) if m else '')
          EOF
          )
          [ -n "$VER" ] || { echo "APP_VERSION not found in meowify.py"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VER" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$VER is already released, nothing to do"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: release notes
        if: steps.ver.outputs.exists == 'false'
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          python3 - <<'EOF'
          import os, re
          ver = os.environ['VER']
          text = open('CHANGELOG.md', encoding='utf-8').read() if os.path.exists('CHANGELOG.md') else ''
          m = re.search(r'^## \[?' + re.escape(ver) + r'\]?[^\n]*\n(.*?)(?=^## |\Z)', text, re.S | re.M)
          body = m.group(1).strip() if m else ''
          short = ' / '.join(l.lstrip('-* ').strip() for l in body.splitlines() if l.strip())[:300]
          head = ('**windows:** `irm https://github.com/xtimmie/meowify/releases/latest/download/install.ps1 | iex`\n\n'
                  '**linux:** `curl -fsSL https://github.com/xtimmie/meowify/releases/latest/download/install.sh | bash`\n\n'
                  'the other files are used by the installer and the in-app updater.\n\n')
          open('release_body.md', 'w', encoding='utf-8').write(head + (body or 'no changelog entry for this version.'))
          open('notes.txt', 'w', encoding='utf-8').write(short)
          EOF

      - name: build manifest
        if: steps.ver.outputs.exists == 'false'
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          python3 - <<'EOF'
          import hashlib, json, os
          ver = os.environ['VER']
          mu = open('motionui.version').read().strip()
          sha = lambda p: hashlib.sha256(open(p, 'rb').read()).hexdigest()
          files = ['meowify.py', 'requirements.txt', 'launcher.pyw', 'android_patch.py']
          notes = open('notes.txt', encoding='utf-8').read().strip()
          man = {'version': ver, 'tag': 'v' + ver, 'motionui': mu, 'min_python': '3.10', 'notes': notes,
                 'files': {f: sha(f) for f in files}}
          json.dump(man, open('manifest.json', 'w'), indent=2)
          EOF

      - name: publish release
        if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release_body.md
          files: |
            manifest.json
            meowify.py
            requirements.txt
            launcher.pyw
            android_patch.py
            install.ps1
            install.sh